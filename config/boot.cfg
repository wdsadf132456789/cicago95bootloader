; Chicago-95 Bootloader Configuration
; Loaded at boot, parsed by Stage 2

[boot]
timeout_ms=5000
default=0
splash=1

[kernel]
path=/boot/chicago95.elf
args=--quiet
snapshot=1
snapshot=1

[security]
firewall=1
dns_encrypt=1
wifi_encrypt=1
adaptive=1
block_duration_ms=60000

[firewall]
max_rules=256
max_connections=1024
syn_flood_threshold=100
rate_limit_pps=10000

[dns]
provider=doh
server_url=https://dns.google/dns-query
server=1.1.1.1
port=853

[wifi]
ssid=ChicagoNet
wpa3_only=0

[display]
mode=text
resolution=80x25
